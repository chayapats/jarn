name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python }}
          save-cache: false
      - name: Sync deps
        # telegram extra pulls aiogram so gateway/bot tests exercise the real
        # optional dependency (not just importorskip skips).
        run: uv sync --extra dev --extra telegram
      - name: Lint
        run: uv run ruff check src tests scripts
      # POSIX-only APIs (fcntl, killpg, …) are not modeled on win32; type-check on Unix.
      - name: Type-check
        if: runner.os != 'Windows'
        run: uv run mypy src/
      - name: Test
        run: >-
          uv run pytest -q
          --cov=src/jarn
          --cov-report=term-missing
          --cov-fail-under=74
        # Live-LLM e2e suite is intentionally excluded from CI (slow / costs tokens).

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          save-cache: false
      - run: uv sync --extra dev --extra telegram
      - run: uv build
      - run: uv run pytest tests/test_packaging.py -q

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Launcher tests
        run: node --test npm/jarn-cli/test/launcher.test.js
      - name: Assembly-script tests
        run: node --test npm/test/build.test.mjs

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          save-cache: false
      - run: uv sync --extra dev
      - name: Benchmark CLI, interactive PTY, and offline doctor
        run: >-
          uv run python scripts/benchmark_startup.py
          --executable .venv/bin/jarn
          --runs 10
          --warmups 2
          --output performance.json
      - name: Upload machine-readable performance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-${{ github.run_id }}
          path: performance.json
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          save-cache: false
      - name: Sync deps
        run: uv sync --extra dev --extra telegram
      - name: Dependency audit (pip-audit)
        run: |
          uv pip install pip-audit==2.9.0
          uv run pip-audit
      - name: Subprocess security boundary audit
        run: uv run python scripts/audit_subprocesses.py
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actionlint:
    # Lint release/CI and example workflows with a pinned actionlint binary.
    # This job runs only in GitHub CI (requires curl + linux-amd64).
    # action/action.yml is a composite-action metadata file (not a workflow), so
    # actionlint cannot lint it.  To run locally: brew install actionlint &&
    # actionlint examples/github/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download pinned actionlint
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION="1.7.12"
          # Real SHA256 of actionlint_1.7.12_linux_amd64.tar.gz from the release
          # checksums file (actionlint_1.7.12_checksums.txt), verified against the
          # downloaded artifact. Fail-closed: sha256sum -c aborts on any mismatch.
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
      - name: Lint release and example workflows
        run: >-
          ./actionlint
          .github/workflows/ci.yml
          .github/workflows/release.yml
          .github/workflows/nightly.yml
          examples/github/pr-review.yml
          examples/github/issue-fix.yml
